{% extends "base.html" %}

{% block title %}Sign in — Waffle Wallet{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            {% include "_logo.html" %}
            <h1 class="auth-title">Oh, you're back.</h1>
            <p class="auth-subtitle">Sign in. Your expenses haven't gone anywhere. Unlike your money.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="you@example.com"
                           autocomplete="email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="The one you swore you'd remember"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>

        <p class="auth-switch">
            New here?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>

    </div>
</section>

{% endblock %}
